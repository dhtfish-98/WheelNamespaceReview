[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-namespace-review"
version = "0.1.2"
description = "Read-only wheel inventory, installation namespace and startup entry review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/check-wheel-contents-MIT.txt"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = ["packaging>=24.2,<27"]

[project.scripts]
wheel-namespace-review = "wheel_namespace_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wheel-namespace-review" = ["ORIGIN.md", "DEFENSIVE_SCOPE.md", "VALIDATION.md", "SOURCE_REVIEW_MANIFEST.json"]
