name: Read-only wheel review validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install review tool and pinned build tools
        run: python -m pip install . packaging==25.0 build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Run focused suite
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check installed CLI
        run: |
          wheel-namespace-review --version
          wheel-namespace-review dist/wheel_namespace_review-0.1.3-py3-none-any.whl
